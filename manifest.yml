modules:
  function:
    - key: parse-report-fn
      handler: index.parseReport
    - key: find-duplicates-fn
      handler: index.findDuplicates
    - key: score-severity-fn
      handler: index.scoreSeverity
    - key: missing-evidence-fn
      handler: index.missingEvidence
    - key: route-owner-fn
      handler: index.routeOwner
    - key: panel-resolver-fn
      handler: index.handler
  action:
    - key: parse-report
      name: Parse security report
      description: "Parse a free-text security report into structured fields: affected component, versions, reproduction steps, and claimed impact."
      function: parse-report-fn
      actionVerb: GET
      inputs:
        reportText:
          type: string
          description: The full text of the security report. Omit when issueKey is given instead.
          required: false
        issueKey:
          type: string
          description: Key of the Jira issue holding the report, e.g. SEC-123.
          required: false
    - key: find-duplicates
      name: Find duplicate issues
      description: Search existing Jira issues for likely duplicates of a security report, scored by component, impact class, version, and keyword overlap.
      function: find-duplicates-fn
      actionVerb: GET
      inputs:
        reportText:
          type: string
          description: The full text of the security report. Omit when issueKey is given instead.
          required: false
        issueKey:
          type: string
          description: Key of the Jira issue holding the report, e.g. SEC-123.
          required: false
    - key: score-severity
      name: Score report severity
      description: Score a security report with the transparent team rubric. Every factor cites the exact report text it rests on, and the result carries a confidence level and an escalation recommendation.
      function: score-severity-fn
      actionVerb: GET
      inputs:
        reportText:
          type: string
          description: The full text of the security report. Omit when issueKey is given instead.
          required: false
        issueKey:
          type: string
          description: Key of the Jira issue holding the report, e.g. SEC-123.
          required: false
    - key: missing-evidence
      name: List missing evidence
      description: List exactly what reproduction evidence is still missing from a security report, as a checklist, marking which items block escalation.
      function: missing-evidence-fn
      actionVerb: GET
      inputs:
        reportText:
          type: string
          description: The full text of the security report. Omit when issueKey is given instead.
          required: false
        issueKey:
          type: string
          description: Key of the Jira issue holding the report, e.g. SEC-123.
          required: false
    - key: route-owner
      name: Route to owning team
      description: Find the owning team for a report's affected component, from the team-configurable component table (Teamwork Graph when enabled, project lead as a last fallback).
      function: route-owner-fn
      actionVerb: GET
      inputs:
        component:
          type: string
          description: Affected component, e.g. login or checkout. Omit when issueKey is given instead.
          required: false
        issueKey:
          type: string
          description: Key of the Jira issue holding the report, e.g. SEC-123.
          required: false
        projectKey:
          type: string
          description: Project key used for the project-lead fallback, e.g. SEC.
          required: false
  rovo:agent:
    - key: repro-triage-agent
      name: Repro Triage Agent
      description: Triages incoming security reports. Parses the report, dedups against known issues, scores severity with a cited rubric, lists missing reproduction evidence, and routes to the owning team. Read-only; a human confirms before any write.
      prompt: resource:repro-prompt;prompt.txt
      actions:
        - parse-report
        - find-duplicates
        - score-severity
        - missing-evidence
        - route-owner
      skills:
        - repro-rubric
      conversationStarters:
        - Triage this security report
        - Is this report a duplicate of a known issue?
        - What reproduction evidence is still missing?
  rovo:skill:
    - key: repro-rubric
      source:
        dir: skills/repro-rubric
      dependencies:
        tools:
          - parse-report
          - find-duplicates
          - score-severity
          - missing-evidence
          - route-owner
  rovo:mcp:
    - key: repro-mcp
      name: Repro Triage Tools
      tools:
        - parse-report
        - find-duplicates
        - score-severity
        - missing-evidence
        - route-owner
  jira:issuePanel:
    - key: repro-panel
      resource: repro-panel-ui
      resolver:
        function: panel-resolver-fn
      render: native
      title: Repro triage
resources:
  # The agent prompt is read from this directory by the manifest
  # interpolator: `prompt: resource:repro-prompt;prompt.txt`.
  - key: repro-prompt
    path: resources
  - key: repro-panel-ui
    path: src/frontend/index.jsx
permissions:
  scopes:
    # Minimal read-only set. Every scope is used by a handler in src/index.js.
    # Teamwork Graph scopes are deliberately NOT listed: routing works from
    # the component table without them. To enable TWG routing, add
    # read:graph:issue:jira, read:graph:team:atlassian and
    # read:graph:user:atlassian here (needs an org admin grant at install)
    # and flip TWG_ENABLED on in src/index.js after verifying a curated
    # query in the TWG query builder.
    - read:jira-work
    - read:jira-user
    - search:jira
app:
  runtime:
    name: nodejs24.x
  # App ID is assigned by `forge create` (or `forge register` for a
  # manually scaffolded app). Placeholder until registration runs.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
